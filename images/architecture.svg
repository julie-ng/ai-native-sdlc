<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 30 1100 744" role="img" aria-labelledby="sdlc-architecture-title sdlc-architecture-desc" width="1100" height="744">
<title id="sdlc-architecture-title">Kubernetes architecture</title>
<desc id="sdlc-architecture-desc"> One Kubernetes cluster with four namespaces: platform with the workflow service and artifact service; argo with Argo Workflows; agents with planner, coder and reviewer pods, each with its own ServiceAccount; and github-broker with the GitHub token broker. 1: GitHub sends webhooks to the workflow service. 2: The workflow service submits runs to Argo Workflows. 3: Argo runs each step as an agent pod. 4: Agents get scoped GitHub tokens from the broker. 5: Agents call models through the Vercel AI Gateway. 6: Agents push and comment on GitHub. 7: Agents update status and store artifacts through the platform services. Below the cluster are the supporting services: PostgreSQL, object storage, a container registry and a secret store. </desc>
<style>
@import url("https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;600;700&amp;family=Source+Sans+3:wght@400;500;600;700&amp;display=swap");
svg { --font-sans: "Source Sans 3", Helvetica, Arial, sans-serif; --font-mono: "Roboto Mono", Courier, monospace; --ui-color-primary-500: #4652c6; --ui-color-primary-50: #eef0fb; --ui-color-secondary-500: #00bba7; --ui-color-secondary-50: #f0fdfa; --ui-bg: #ffffff; --ui-color-primary-300: #a3abe6; --ui-color-primary-900: #262a5e; --ui-color-secondary-300: #46edd5; --ui-color-secondary-900: #0b4f4a; --ui-text-highlighted: #101828; --ui-text: #364153; --ui-text-muted: #6a7282; --ui-text-toned: #4a5565; --ui-bg-elevated: #f3f4f6; --ui-border-accented: #d1d5dc; --ui-color-primary-600: #3a42b0; }
svg { --platform: var(--ui-color-primary-500); --platform-bg: var(--ui-color-primary-50); --agent: var(--ui-color-secondary-500); --agent-bg: var(--ui-color-secondary-50); --cluster-bg: color-mix(in oklab, #326ce5 4%, var(--ui-bg)); }
