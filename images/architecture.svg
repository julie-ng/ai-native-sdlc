.box-platform { fill: var(--platform-bg); stroke: var(--platform); }
.arrow, .box-agent, .box-platform, .link, .link-dot { stroke-width: 1.5px; }
.box-agent { fill: var(--agent-bg); stroke: var(--agent); }
.arrow { fill: none; stroke: var(--ui-text-muted); }
.head { fill: var(--ui-text-muted); }
.arrow-agent { stroke: var(--agent); }
.head-agent { fill: var(--agent); }
.link { stroke-dasharray: 3, 3; }
.link, .link-dot { stroke: var(--ui-border-accented); }
.link-dot { fill: var(--ui-bg); }
.step { fill: var(--ui-color-primary-600); }
.ic-mono { color: var(--ui-text-highlighted); }
.ic-k8s { color: rgb(50, 108, 229); }
@media (prefers-color-scheme: dark) {
  svg { --ui-bg: #101828; --ui-text-highlighted: #ffffff; --ui-text: #e5e7eb; --ui-text-muted: #99a1af; --ui-text-toned: #d1d5dc; --ui-bg-elevated: #1e2939; --ui-border-accented: #364153; }
  svg { --platform: var(--ui-color-primary-300); --platform-bg: color-mix(in oklab, var(--ui-color-primary-900) 30%, transparent); --agent: var(--ui-color-secondary-300); --agent-bg: color-mix(in oklab, var(--ui-color-secondary-900) 30%, transparent); --cluster-bg: color-mix(in oklab, #326ce5 8%, var(--ui-bg)); }
}
</style>
