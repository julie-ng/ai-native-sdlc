<svg viewBox="0 30 860 560" role="img" aria-labelledby="credentials-title credentials-desc" xmlns="http://www.w3.org/2000/svg" width="860" height="560">
<title id="credentials-title">Short-lived credentials</title>
<desc id="credentials-desc"> The Kubernetes control plane issues short-lived tokens to platform services and agent pods. Platform services exchange their token with the cloud identity provider and call cloud services with the access token. Agent pods request a token from the GitHub token broker, which scopes it to the role and one repository, then push and comment on GitHub. The identity provider, cloud services and GitHub sit outside the cluster. </desc>
<style>
@import url("https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;600;700&amp;family=Source+Sans+3:wght@400;500;600;700&amp;display=swap");
svg { --font-sans: "Source Sans 3", Helvetica, Arial, sans-serif; --font-mono: "Roboto Mono", Courier, monospace; --ui-color-primary-500: #4652c6; --ui-color-primary-50: #eef0fb; --ui-color-secondary-500: #00bba7; --ui-color-secondary-50: #f0fdfa; --ui-bg: #ffffff; --ui-color-primary-300: #a3abe6; --ui-color-primary-900: #262a5e; --ui-color-secondary-300: #46edd5; --ui-color-secondary-900: #0b4f4a; --ui-text-highlighted: #101828; --ui-text-muted: #6a7282; --ui-text-toned: #4a5565; --ui-bg-elevated: #f3f4f6; --ui-border-accented: #d1d5dc; --ui-color-primary-600: #3a42b0; }
svg { --platform: var(--ui-color-primary-500); --platform-bg: var(--ui-color-primary-50); --agent: var(--ui-color-secondary-500); --agent-bg: var(--ui-color-secondary-50); --cluster-bg: color-mix(in oklab, #326ce5 4%, var(--ui-bg)); }
.t-mono { font-family: var(--font-mono); }
.t-sans { font-family: var(--font-sans); }
.t-heading { font-size: 16px; font-weight: 700; }
.t-heading, .t-label { fill: var(--ui-text-highlighted); }
.t-label { font-size: 14px; font-weight: 600; }
.t-small { fill: var(--ui-text-muted); font-size: 13px; }
.t-arrow { fill: var(--ui-text-toned); font-size: 13px; }
.t-step { fill: rgb(255, 255, 255); font-size: 12px; font-weight: 700; }
.box-ext { fill: var(--ui-bg-elevated); stroke: var(--ui-border-accented); }
.arrow, .box-agent, .box-cluster, .box-ext, .box-platform, .box-stack-agent, .box-stack-platform, .divider { stroke-width: 1.5px; }
.box-cluster { fill: var(--cluster-bg); stroke: rgb(50, 108, 229); }
.box-platform { fill: var(--platform-bg); stroke: var(--platform); }
.box-agent { fill: var(--agent-bg); stroke: var(--agent); }
.box-stack-platform { fill: var(--platform-bg); stroke: var(--platform); }
.box-stack-agent { fill: var(--agent-bg); stroke: var(--agent); }
.divider { stroke: var(--ui-border-accented); stroke-dasharray: 3, 4; }
.arrow { fill: none; stroke: var(--ui-text-muted); }
.head { fill: var(--ui-text-muted); }
.arrow-agent { stroke: var(--agent); }
.head-agent { fill: var(--agent); }
.step { fill: var(--ui-color-primary-600); }
.ic-mono { color: var(--ui-text-highlighted); }
.ic-muted { color: var(--ui-text-muted); }
.ic-k8s { color: rgb(50, 108, 229); }
@media (prefers-color-scheme: dark) {
  svg { --ui-bg: #101828; --ui-text-highlighted: #ffffff; --ui-text-muted: #99a1af; --ui-text-toned: #d1d5dc; --ui-bg-elevated: #1e2939; --ui-border-accented: #364153; }
  svg { --platform: var(--ui-color-primary-300); --platform-bg: color-mix(in oklab, var(--ui-color-primary-900) 30%, var(--cluster-bg)); --agent: var(--ui-color-secondary-300); --agent-bg: color-mix(in oklab, var(--ui-color-secondary-900) 30%, var(--cluster-bg)); --cluster-bg: color-mix(in oklab, #326ce5 8%, var(--ui-bg)); }
}
</style>
